<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Forms</title></head>
<body>
  <!-- Static form definition so Netlify can detect the contact form at deploy time. -->
  <form name="kontakt" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="kontakt">
    <input name="bot-field">
    <input name="name">
    <input name="phone">
    <input name="email">
    <input name="service">
    <textarea name="message"></textarea>
  </form>
</body>
</html>
