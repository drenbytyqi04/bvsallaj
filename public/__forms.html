<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Forms</title></head>
<body>
  <!-- Static form definition so Netlify detects the contact form at deploy time. Do not delete. -->
  <form name="kontakt" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
    <input type="hidden" name="form-name" value="kontakt">
    <input name="bot-field">
    <input name="sprache">
    <input name="name">
    <input name="phone">
    <input name="email">
    <input name="service">
    <textarea name="message"></textarea>
    <input type="file" name="foto">
    <input type="checkbox" name="privacy">
  </form>
</body>
</html>
